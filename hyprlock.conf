source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    color = $background
}

general {
    hide_cursor = true
    no_fade_in = false
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outer_color = $outline
    inner_color = $surface_container
    font_color = $foreground
    placeholder_text = <i>Password...</i>
    fade_on_empty = false
    rounding = 12
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = $foreground
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}
